<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com CSS</title>
    <style>
        p {
            color: blue;
            line-height: 1.7;
        }
    </style>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <h1>Aprendendo CSS</h1>
    <p style="color: rgb(148, 93, 20); line-height: 1.7;">Este texto está estilizado inline </p>
    <p>A cor que está vendo nessa frase é azul, feita pelo estilo interno </p>
    <p>Este é outro texto estilizado, porém com o estilo externo</p>
    <h2 id="subtitulo">Seletor ID</h2>

</body>

</html>
